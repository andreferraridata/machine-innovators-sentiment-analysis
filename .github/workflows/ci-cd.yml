name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI: style + tests, on every push ----------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/main.py') }}
      - name: Tests
        run: pytest

  # ---------- CD: build image, smoke-test it, publish it (only if CI passed) ----------
  build-publish:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sentiment-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 sentiment-api:ci
          timeout 120 sh -c 'until curl -sf localhost:8000/health; do sleep 2; done'
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"text":"I love this!"}' | tee /dev/stderr | grep -q '"label":"positive"'
      - name: Container logs
        if: failure()
        run: docker logs api
      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${{ github.sha }} latest; do
            docker tag sentiment-api:ci "$IMAGE:$tag" && docker push "$IMAGE:$tag"
          done

  # ---------- Optional: deploy to a Hugging Face Docker Space ----------
  # Active only when the repo has the HF_TOKEN secret and the HF_SPACE variable (e.g. "user/sentiment-api").
  deploy-hf-space:
    needs: build-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload to Space
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN / HF_SPACE not configured: skipping Space deploy."; exit 0
          fi
          pip install -q huggingface_hub
          mkdir space && cp -r Dockerfile requirements.txt app space/
          printf -- '---\ntitle: Sentiment API\nsdk: docker\napp_port: 8000\n---\n' > space/README.md
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api, space = HfApi(), os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=space, repo_type="space")
          EOF

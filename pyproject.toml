[project]
name = "machine-innovators-sentiment-analysis"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "dags"]
addopts = "-q"
